<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="diyafaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#7b1842"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="400" height="400" rx="48" fill="url(#diyafaGrad)"/>

  <!-- Geometric Luxury Border Accent -->
  <rect x="24" y="24" width="352" height="352" rx="36" fill="none" stroke="url(#goldGrad3)" stroke-width="3" opacity="0.45"/>

  <!-- Central Emblem: Stylized Hospitality Palace Arch & Key -->
  <g transform="translate(200, 155)">
    <!-- Traditional Arabesque Dome -->
    <path d="M -55,50 L -55,-5 C -55,-40 -15,-65 0,-80 C 15,-65 55,-40 55,-5 L 55,50 Z" fill="none" stroke="url(#goldGrad3)" stroke-width="6" stroke-linejoin="round"/>
    <!-- Inner Arch -->
    <path d="M -32,50 L -32,10 C -32,-15 -8,-35 0,-45 C 8,-35 32,-15 32,10 L 32,50" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-80" r="8" fill="url(#goldGrad3)"/>
    <circle cx="0" cy="5" r="7" fill="url(#goldGrad3)"/>
    <path d="M 0,12 L 0,38" stroke="url(#goldGrad3)" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="200" y="275" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1">دار الضيافة</text>
  <text x="200" y="315" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-weight="600" font-size="16" fill="#fde047" text-anchor="middle">للشقق المخدومة</text>
  <text x="200" y="348" font-family="'Montserrat', 'Arial', sans-serif" font-weight="700" font-size="12" fill="#fbcfe8" text-anchor="middle" letter-spacing="3">DAR AL-DIYAFA APARTMENTS</text>
</svg>
