<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="wahaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="wahaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="48" fill="url(#wahaGrad)"/>
  <rect x="24" y="24" width="352" height="352" rx="36" fill="none" stroke="url(#wahaGold)" stroke-width="3" opacity="0.45"/>

  <!-- Stylized Modern Towers Motif -->
  <g transform="translate(200, 155)">
    <!-- Center Tower -->
    <path d="M -20,50 L -20,-75 L 0,-95 L 20,-75 L 20,50 Z" fill="none" stroke="url(#wahaGold)" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Left Wing -->
    <path d="M -50,50 L -50,-40 L -20,-60 L -20,50" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.9"/>
    <!-- Right Wing -->
    <path d="M 50,50 L 50,-40 L 20,-60 L 20,50" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.9"/>
    <circle cx="0" cy="-95" r="7" fill="url(#wahaGold)"/>
    <line x1="-10" y1="-20" x2="10" y2="-20" stroke="url(#wahaGold)" stroke-width="2.5"/>
    <line x1="-10" y1="10" x2="10" y2="10" stroke="url(#wahaGold)" stroke-width="2.5"/>
  </g>

  <!-- Brand Typography -->
  <text x="200" y="275" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-weight="800" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="1">أبراج الواحة</text>
  <text x="200" y="315" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-weight="600" font-size="16" fill="#fde68a" text-anchor="middle">للشقق الفندقية</text>
  <text x="200" y="348" font-family="'Montserrat', 'Arial', sans-serif" font-weight="700" font-size="12" fill="#fed7aa" text-anchor="middle" letter-spacing="2.5">AL-WAHA TOWERS APARTMENTS</text>
</svg>
